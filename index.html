    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#10b981', // Emerald 500
                        accent: '#8b5cf6', // Violet 500
                        darkbg: '#0f172a', // Slate 900

                    },

                    }

        }

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        pre { overflow-x: auto; font-size: 0.875rem; }
        code { font-family: 'Courier New', Courier, monospace; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 3D Flip Card CSS */
        .flip-card {
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            overflow-y: auto; /* Allow scrolling for long answers */
        }
    </style>
</head>

                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                                <div className="w-10 h-10 bg-gradient-to-br from-primary to-accent text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md">Py</div>
                                <span className="hidden sm:inline font-extrabold text-xl tracking-tight text-slate-800 dark:text-white">Data<span className="text-primary">Eng</span></span>
                            </div>
                            <nav className="flex items-center space-x-6 text-sm font-bold text-slate-500 dark:text-slate-400">
                                <button onClick={() => setCurrentView('home')} className={`hover:text-primary transition-colors ${currentView === 'home' ? 'text-primary' : ''}`}>Dashboard</button>
                                <button onClick={() => setCurrentView('flashcards')} className={`hover:text-primary transition-colors ${currentView === 'flashcards' ? 'text-primary' : ''}`}>Flash Cards</button>
                                <button onClick={() => setCurrentView('study')} className={`hover:text-primary transition-colors ${currentView === 'study' ? 'text-primary' : ''}`}>Study Guide</button>
                                
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors ml-4 border border-slate-200 dark:border-slate-700">
                                    {darkMode ? <IconSun /> : <IconMoon />}
                                </button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {currentView === 'home' && renderHome()}
                        {currentView === 'flashcards' && renderFlashcards()}
                        {currentView === 'study' && renderStudyGuide()}
                        {currentView === 'quiz_menu' && renderQuizMenu()}
                        {currentView === 'quiz_active' && renderActiveQuiz()}
                        {currentView === 'revision_menu' && renderRevisionMenu()}
                        {currentView === 'revision_viewer' && renderRevisionViewer()}
                    </main>
                    
                    <footer className="bg-white dark:bg-darkcard border-t border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-500 py-6 text-center text-sm">
                        <p>© 2026 Python Data Engineering Platform. Featuring Dark Mode & Interactive Modules.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
